# 群友提需求，AI 分析并在群里讨论。单对话态：只由 /归档 结束。
name: requirement
title: "需求 · {{ text }}"
description: 记录群友需求并交给 AI 分析
provider: omp-alicedev/opencode-go/muse-spark-1.3-contributor
cwd: /workspace/openalice
initial: discussing
states:
  discussing:
    kind: agent
    prompt: discussing.md
    reply:
      kinds: [text, image_template]
      image_templates: [requirement_summary, generic_card]
      stickers: []
      max_text_chars: 600
    agent_commands: [需求, 需求列表, 收藏, 收藏夹, 会话]
