# 管家：管理员的分诊台。判断一件事该交给哪个会话、派出去、之后按需查进度（ARCHITECTURE §13.3）。
# 每个群最多一个；只接收管理员的输入；可以跨群查看和指派。
name: steward
title: "管家 · {{ text }}"
description: 管理员的管家：分诊、指派研究、查看各群会话
provider: omp-alicedev/opencode-go/muse-spark-1.3-contributor
cwd: /workspace/openalice
audience: admin
one_per_chat: true
initial: discussing
states:
  discussing:
    kind: agent
    prompt: discussing.md
    reply:
      kinds: [text, image_template]
      image_templates: [generic_card]
      stickers: []
      max_text_chars: 600
    tools:
      - session_get
      - session_list
      - chats_list
      - status_get
      - requirements_list
      - favorites_list
      - requirement_add
      - favorite_add
      - investigation_start
      - github_analysis_start
      - session_archive
      - session_rename
      - session_link_deliver
