# 预取 GitHub Issue 后由 AI 解读。由 /解读 或路由 github_link 启动。单对话态。
name: github-issue
title: "Issue #{{ github.number }} · {{ github.title }}"
description: 读取 GitHub Issue，提炼背景、现状、风险与可执行建议
provider: omp-alicedev/opencode-go/muse-spark-1.3-contributor
cwd: /workspace/openalice
initial: discussing
states:
  discussing:
    kind: agent
    prompt: discussing.md
    reply:
      kinds: [text, image_template]
      image_templates: [generic_card]
      stickers: []
      max_text_chars: 600
    agent_commands: [需求, 需求列表, 收藏, 收藏夹, 会话]
