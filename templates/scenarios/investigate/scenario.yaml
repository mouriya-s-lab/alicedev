# 调查一个问题：直接回复，或写 Markdown 报告后以文件回复。单对话态。
name: investigate
title: "调查 · {{ text }}"
description: 调查一个问题并直接回复，或生成 Markdown 调查报告
provider: omp-alicedev/opencode-go/muse-spark-1.3-contributor
cwd: /workspace/openalice
initial: discussing
states:
  discussing:
    kind: agent
    prompt: discussing.md
    reply:
      kinds: [text, image_template, file]
      image_templates: [generic_card]
      stickers: []
      max_text_chars: 600
    agent_commands: [需求, 需求列表, 收藏, 收藏夹, 会话]
