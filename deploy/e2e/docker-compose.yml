# Resident e2e stack (ARCHITECTURE §11). Always up; never taken down with the
# `deploy` project. Its AstrBot mounts bot/ and templates/ from a dedicated
# checkout (host /srv/alicedev/e2e-src, paseo /deploy/e2e-src); agents move that
# checkout between the running production SHA and a candidate SHA with
# tools/e2e_driver.py, which restarts this AstrBot and t2i before each side.
#
# Network: joins the `alicedev-e2e` internal network created by the deploy
# project — no egress, no published ports, no production QQ/TG/paseo
# credentials. Only paseo agents (agent-browser) reach its WebChat.
#
# Run from the host checkout:
#   docker compose -f /srv/alicedev/app/deploy/e2e/docker-compose.yml \
#     --env-file /srv/alicedev/deploy/.env up -d --build
name: alicedev-e2e

services:
  # Re-apply the seed config on every `up` (like production's astrbot-init):
  # the data volume outlives the image, and AstrBot rewrites cmd_config.json at
  # runtime, so baking the seed into the image would only reach a fresh volume.
  init:
    image: caddy:2-alpine@sha256:040e9f7480b80b6d4a7e5013a21159b950a63dcbdb956e38abe2387fb28d9ec0
    platform: linux/amd64
    container_name: alicedev-e2e-init
    restart: "no"
    command:
      - sh
      - -ec
      - >-
        mkdir -p /data/config /data/plugin_data/alicedev/images /data/plugin_data/alicedev/reports &&
        cp /seed/cmd_config.json /seed/mcp_server.json /data/ &&
        cp /seed/config/alicedev_config.json /data/config/alicedev_config.json
    volumes:
      - e2e_astrbot_data:/data
      - ./seed-data:/seed:ro
    network_mode: none

  astrbot:
    build:
      context: ../..
      dockerfile: deploy/e2e/Dockerfile
    image: alicedev/e2e:local
    platform: linux/amd64
    container_name: alicedev-e2e-astrbot
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      ASTRBOT_DASHBOARD_INITIAL_PASSWORD: ${E2E_DASHBOARD_PASSWORD:?set E2E_DASHBOARD_PASSWORD}
    expose: ["6185", "6200"]
    volumes:
      - e2e_astrbot_data:/AstrBot/data
      - ${E2E_SRC_DIR:-../../../e2e-src}/bot:/AstrBot/data/plugins/alicedev:ro
      - ${E2E_SRC_DIR:-../../../e2e-src}/templates:/AstrBot/alicedev-templates:ro
    networks: [e2e]
    depends_on:
      init:
        condition: service_completed_successfully
      t2i:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          r = urllib.request.urlopen('http://127.0.0.1:6200/v1/health', timeout=3);
          raise SystemExit(0 if r.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  t2i:
    image: soulter/astrbot-t2i-service:latest@sha256:f7243fd37cc247f13da2b23eb394e77cae18ee7b104440ee776d55419e89f61e
    platform: linux/amd64
    container_name: alicedev-e2e-t2i
    restart: unless-stopped
    expose: ["8999"]
    networks: [e2e]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import socket;
          s = socket.create_connection(('127.0.0.1', 8999), 3);
          s.close()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  e2e:
    name: alicedev-e2e
    external: true

volumes:
  e2e_astrbot_data:
    name: alicedev_e2e_astrbot_data
