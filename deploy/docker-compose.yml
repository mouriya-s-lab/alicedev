services:
  # Build-only service. `make build` builds this first, then the child image below.
  paseo-base:
    platform: linux/amd64
    image: alicedev/paseo-arch:local
    profiles: [build]
    build:
      context: ${PASEO_REPO_CONTEXT:-../../paseo-alicedev}
      dockerfile: docker/arch/Dockerfile
      args:
        PASEO_VERSION: ${PASEO_VERSION:-0.8.0}
        OMP_VERSION: ${OMP_VERSION:-18.2.5}
        EXPO_PUBLIC_PASEO_SELFHOSTED: "true"
        EXPO_PUBLIC_LOCAL_DAEMON: self-hosted

  # The gateway mounts the reports volume at its _published subpath. Create that
  # subdirectory before Docker creates the gateway container mount.
  reports-init:
    image: caddy:2-alpine@sha256:040e9f7480b80b6d4a7e5013a21159b950a63dcbdb956e38abe2387fb28d9ec0
    platform: linux/amd64
    container_name: alicedev-reports-init
    restart: "no"
    command: ["sh", "-ec", "mkdir -p /reports/_published && chown 1000:1000 /reports /reports/_published"]
    volumes:
      - reports:/reports

  # AstrBot rewrites cmd_config.json atomically (temp file + rename), which a
  # read-only single-file bind mount cannot survive (EBUSY). Seed the rendered
  # configs into the data volume instead; every `up` re-applies the render.
  astrbot-init:
    image: caddy:2-alpine@sha256:040e9f7480b80b6d4a7e5013a21159b950a63dcbdb956e38abe2387fb28d9ec0
    platform: linux/amd64
    container_name: alicedev-astrbot-init
    restart: "no"
    environment:
      # The rendered cmd_config carries this token; require it before any
      # `up` so a missing token cannot silently disable reverse WS auth.
      NAPCAT_ONEBOT_TOKEN: ${NAPCAT_ONEBOT_TOKEN:?set NAPCAT_ONEBOT_TOKEN}
    command: ["sh", "-ec", "mkdir -p /data/config && cp /seed/cmd_config.json /data/cmd_config.json && cp /seed/alicedev_config.json /data/config/alicedev_config.json"]
    volumes:
      - astrbot_data:/data
      - ./astrbot/cmd_config.rendered.json:/seed/cmd_config.json:ro
      - ./astrbot/alicedev_config.rendered.json:/seed/alicedev_config.json:ro

  caddy:
    image: caddy:2-alpine@sha256:040e9f7480b80b6d4a7e5013a21159b950a63dcbdb956e38abe2387fb28d9ec0
    platform: linux/amd64
    container_name: alicedev-caddy
    restart: unless-stopped
    environment:
      ALICEDEV_HOST: ${ALICEDEV_HOST:?set ALICEDEV_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, internal]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    image: alicedev/gateway:local
    platform: linux/amd64
    container_name: alicedev-gateway
    restart: unless-stopped
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET}
      ALICEDEV_INTERNAL_TOKEN: ${ALICEDEV_INTERNAL_TOKEN:?set ALICEDEV_INTERNAL_TOKEN}
      PASEO_PASSWORD: ${PASEO_PASSWORD:?set PASEO_PASSWORD}
      PASEO_UPSTREAM: http://paseo:6767
      BOT_UPSTREAM: http://astrbot:6200
      PUBLIC_HOST: ${ALICEDEV_HOST:?set ALICEDEV_HOST}
      REPORTS_PUBLISHED_ROOT: /srv/alicedev/reports/_published
    expose: ["8080"]
    volumes:
      - type: volume
        source: reports
        target: /srv/alicedev/reports/_published
        read_only: true
        volume:
          subpath: _published
    networks: [internal]
    depends_on:
      paseo:
        condition: service_healthy
      astrbot:
        condition: service_healthy
      reports-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/_alicedev/health', timeout=3); d=json.load(r); raise SystemExit(0 if r.status == 200 and d.get('ok') is True else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  astrbot:
    image: soulter/astrbot:latest@sha256:8e9f108c1470e6dd46bbbaad0d01e93d740dd86ee8d1cd767a10106aefd62ecf
    platform: linux/amd64
    container_name: alicedev-astrbot
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      ASTRBOT_DASHBOARD_INITIAL_PASSWORD: ${ASTRBOT_DASHBOARD_INITIAL_PASSWORD:?set ASTRBOT_DASHBOARD_INITIAL_PASSWORD}
    ports:
      # Bind the dashboard to PANEL_BIND_IP (netbird wt0 on the host) so mesh
      # peers reach it directly; falls back to loopback when unset.
      - "${PANEL_BIND_IP:-127.0.0.1}:6185:6185"
    volumes:
      - astrbot_data:/AstrBot/data
      - ../bot:/AstrBot/data/plugins/alicedev
      - ../templates:/AstrBot/alicedev-templates
      - reports:/srv/alicedev/reports
    networks: [internal, edge]   # edge = egress for Telegram API / GitHub / t2i is internal
    depends_on:
      t2i:
        condition: service_healthy
      astrbot-init:
        condition: service_completed_successfully
    expose: ["6199", "6200"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:6200/v1/health', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 45s

  napcat:
    # v4.18.28 amd64 manifest; keep the tag and digest together.
    image: mlikiowa/napcat-docker:v4.18.28@sha256:41b1a8e10953065f4796ab19c0c8760cd3175376be976c5480710d29a77357ee
    platform: linux/amd64
    container_name: alicedev-napcat
    # Pin a stable, ordinary-looking device name so QQ does not see a new
    # device on every container recreate (default hostname = container id).
    hostname: DESKTOP-Q7M3K8P
    restart: unless-stopped
    # CPU-only: the image uses its virtual display and has no GPU devices.
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      MODE: astrbot
      TZ: Asia/Shanghai
    ports:
      # Bind the WebUI to PANEL_BIND_IP (netbird wt0 on the host) so mesh peers
      # reach it directly; falls back to loopback when unset.
      - "${PANEL_BIND_IP:-127.0.0.1}:6099:6099"
    volumes:
      - napcat_qq:/app/.config/QQ
      - napcat_config:/app/napcat/config
      - napcat_plugins:/app/napcat/plugins
    # Internal carries reverse WS; edge is only for QQ's outbound access.
    networks: [internal, edge]
    depends_on:
      astrbot:
        condition: service_healthy

  t2i:
    image: soulter/astrbot-t2i-service:latest@sha256:f7243fd37cc247f13da2b23eb394e77cae18ee7b104440ee776d55419e89f61e
    platform: linux/amd64
    container_name: alicedev-t2i
    restart: unless-stopped
    expose: ["8999"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8999), 3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 45s

  paseo:
    image: alicedev/paseo:local
    platform: linux/amd64
    container_name: alicedev-paseo
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/paseo/Dockerfile
      args:
        PASEO_ARCH_IMAGE: alicedev/paseo-arch:local
    environment:
      PASEO_PASSWORD: ${PASEO_PASSWORD:?set PASEO_PASSWORD}
      ALICEDEV_INTERNAL_API: http://astrbot:6200
      ALICEDEV_INTERNAL_TOKEN: ${ALICEDEV_INTERNAL_TOKEN:?set ALICEDEV_INTERNAL_TOKEN}
      # paseo validates Host on both internal bot calls and public gateway calls.
      PASEO_HOSTNAMES: paseo,${ALICEDEV_HOST:?set ALICEDEV_HOST},localhost
      PASEO_LISTEN: 0.0.0.0:6767
      PASEO_WEB_UI_ENABLED: "true"
      # omp inside paseo reads this key for the opencode-go provider.
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:?}
    expose: ["6767"]
    volumes:
      - paseo_home:/home/paseo
      - workspace:/workspace
      - reports:/srv/alicedev/reports
    networks: [internal, edge]   # edge = egress for the model provider API and git clones
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:6767/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 45s

networks:
  edge:
    name: alicedev-edge
  internal:
    name: alicedev
    internal: true

volumes:
  astrbot_data:
    name: alicedev_astrbot_data
  napcat_qq:
    name: alicedev_napcat_qq
  napcat_config:
    name: alicedev_napcat_config
  napcat_plugins:
    name: alicedev_napcat_plugins
  paseo_home:
    name: alicedev_paseo_home
  workspace:
    name: alicedev_workspace
  reports:
    name: alicedev_reports
  caddy_data:
    name: alicedev_caddy_data
  caddy_config:
    name: alicedev_caddy_config
