# Build contexts and bind mounts come from two host checkouts that sit next to
# this deploy/ directory (ARCHITECTURE §11):
#   ../app        alicedev checkout owned by tools/deployctl (bot/, templates/,
#                 Dockerfiles, harness sources). Override with ALICEDEV_APP_DIR
#                 (e.g. `..` when running from a developer checkout).
#   ../src/paseo  unmodified upstream paseo source (mouriya-s-lab/paseo at
#                 PASEO_SRC_REF), used only to build the paseo base image.
services:
  # Build-only service: upstream paseo, unmodified, built from its own
  # docker/base/Dockerfile. SELFHOSTED=true makes the bundled web UI use the
  # gateway's self-hosted manifest (/_paseo/hosts.json). `make build` builds
  # this first, then the alicedev child image below.
  paseo-base:
    platform: linux/amd64
    image: alicedev/paseo-base:local
    profiles: [build]
    build:
      context: ${PASEO_SRC_CONTEXT:-../src/paseo}
      dockerfile: docker/base/Dockerfile
      args:
        PASEO_VERSION: ${PASEO_VERSION:-0.8.0}
        EXPO_PUBLIC_PASEO_SELFHOSTED: "true"
        EXPO_PUBLIC_LOCAL_DAEMON: self-hosted

  # The gateway mounts the reports volume at its _published subpath. Create that
  # subdirectory before Docker creates the gateway container mount.
  reports-init:
    image: caddy:2-alpine@sha256:040e9f7480b80b6d4a7e5013a21159b950a63dcbdb956e38abe2387fb28d9ec0
    platform: linux/amd64
    container_name: alicedev-reports-init
    restart: "no"
    command: ["sh", "-ec", "mkdir -p /reports/_published && chown 1000:1000 /reports /reports/_published"]
    volumes:
      - reports:/reports

  # AstrBot rewrites cmd_config.json atomically (temp file + rename), which a
  # read-only single-file bind mount cannot survive (EBUSY). Seed the rendered
  # configs into the data volume instead; every `up` re-applies the render.
  astrbot-init:
    image: caddy:2-alpine@sha256:040e9f7480b80b6d4a7e5013a21159b950a63dcbdb956e38abe2387fb28d9ec0
    platform: linux/amd64
    container_name: alicedev-astrbot-init
    restart: "no"
    environment:
      # The rendered cmd_config carries this token; require it before any
      # `up` so a missing token cannot silently disable reverse WS auth.
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:?set ONEBOT_ACCESS_TOKEN}
    command: ["sh", "-ec", "mkdir -p /data/config && cp /seed/cmd_config.json /data/cmd_config.json && cp /seed/alicedev_config.json /data/config/alicedev_config.json"]
    volumes:
      - astrbot_data:/data
      - ./astrbot/cmd_config.rendered.json:/seed/cmd_config.json:ro
      - ./astrbot/alicedev_config.rendered.json:/seed/alicedev_config.json:ro

  caddy:
    image: caddy:2-alpine@sha256:040e9f7480b80b6d4a7e5013a21159b950a63dcbdb956e38abe2387fb28d9ec0
    platform: linux/amd64
    container_name: alicedev-caddy
    restart: unless-stopped
    environment:
      ALICEDEV_HOST: ${ALICEDEV_HOST:?set ALICEDEV_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, internal]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    image: alicedev/gateway:local
    platform: linux/amd64
    container_name: alicedev-gateway
    restart: unless-stopped
    build:
      context: ${ALICEDEV_APP_DIR:-../app}
      dockerfile: gateway/Dockerfile
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET}
      ALICEDEV_INTERNAL_TOKEN: ${ALICEDEV_INTERNAL_TOKEN:?set ALICEDEV_INTERNAL_TOKEN}
      PASEO_PASSWORD: ${PASEO_PASSWORD:?set PASEO_PASSWORD}
      PASEO_UPSTREAM: http://paseo:6767
      BOT_UPSTREAM: http://astrbot:6200
      PUBLIC_HOST: ${ALICEDEV_HOST:?set ALICEDEV_HOST}
      REPORTS_PUBLISHED_ROOT: /srv/alicedev/reports/_published
    expose: ["8080"]
    volumes:
      - type: volume
        source: reports
        target: /srv/alicedev/reports/_published
        read_only: true
        volume:
          subpath: _published
    networks: [internal]
    depends_on:
      paseo:
        condition: service_healthy
      astrbot:
        condition: service_healthy
      reports-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/_alicedev/health', timeout=3); d=json.load(r); raise SystemExit(0 if r.status == 200 and d.get('ok') is True else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  astrbot:
    # Pinned upstream AstrBot + static docker CLI (deploy/astrbot/Dockerfile).
    image: alicedev/astrbot:local
    platform: linux/amd64
    build:
      context: ${ALICEDEV_APP_DIR:-../app}
      dockerfile: deploy/astrbot/Dockerfile
    container_name: alicedev-astrbot
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      ASTRBOT_DASHBOARD_INITIAL_PASSWORD: ${ASTRBOT_DASHBOARD_INITIAL_PASSWORD:?set ASTRBOT_DASHBOARD_INITIAL_PASSWORD}
    ports:
      # Bind the dashboard to PANEL_BIND_IP (netbird wt0 on the host) so mesh
      # peers reach it directly; falls back to loopback when unset.
      - "${PANEL_BIND_IP:-127.0.0.1}:6185:6185"
    volumes:
      - astrbot_data:/AstrBot/data
      # bot/ and templates/ come from the deployctl-owned checkout; a deploy
      # moves the checkout and hot-reloads the plugin (no restart).
      - ${ALICEDEV_APP_DIR:-../app}/bot:/AstrBot/data/plugins/alicedev
      - ${ALICEDEV_APP_DIR:-../app}/templates:/AstrBot/alicedev-templates
      - reports:/srv/alicedev/reports
      # The plugin reaches the paseo daemon only via `docker exec alicedev-paseo paseo … --json`.
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal, edge]   # edge = egress for Telegram API / GitHub / t2i is internal
    depends_on:
      t2i:
        condition: service_healthy
      astrbot-init:
        condition: service_completed_successfully
    expose: ["6199", "6200"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:6200/v1/health', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 45s

  # Seed SnowLuma's OneBot reverse-WS client config into its data volume before
  # it starts. onebot.json is global adapter config (NOT login state); it is
  # re-applied every `up` and lives safely beside the persisted device identity
  # in the same volume. chown to the in-container snowluma uid so SnowLuma can
  # normalize/rewrite it on load.
  snowluma-init:
    image: caddy:2-alpine@sha256:040e9f7480b80b6d4a7e5013a21159b950a63dcbdb956e38abe2387fb28d9ec0
    platform: linux/amd64
    container_name: alicedev-snowluma-init
    restart: "no"
    environment:
      # The rendered onebot.json carries this token; require it before any `up`
      # so a missing token cannot silently drop reverse-WS auth.
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:?set ONEBOT_ACCESS_TOKEN}
      SNOWLUMA_UID: ${SNOWLUMA_UID:-1000}
      SNOWLUMA_GID: ${SNOWLUMA_GID:-1000}
    command: ["sh", "-ec", "mkdir -p /data/config && cp /seed/onebot.json /data/config/onebot.json && chown -R \"$${SNOWLUMA_UID}:$${SNOWLUMA_GID}\" /data/config"]
    volumes:
      - qq-gateway-data:/data
      - ./astrbot/snowluma_onebot.rendered.json:/seed/onebot.json:ro

  snowluma:
    # NTQQ -> OneBot v11 bridge; replaces NapCat. Persists device identity in
    # named volumes so restarts do NOT drop the QQ session (NapCat's failure).
    # Digest resolved 2026-09-22 (linux/amd64); keep tag+digest together.
    image: motricseven7/snowluma:latest@sha256:28efabd86a432b7b12ccb87bed098705cf05c22cea50dcbf1930bdf288c9d0f0
    platform: linux/amd64
    container_name: alicedev-snowluma
    restart: unless-stopped
    # QQ's bundled Chromium needs a large /dev/shm; the native hook injects into
    # the QQ process via ptrace, which the default seccomp profile blocks.
    shm_size: 1gb
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      TZ: Asia/Shanghai
      SNOWLUMA_UID: ${SNOWLUMA_UID:-1000}
      SNOWLUMA_GID: ${SNOWLUMA_GID:-1000}
      SNOWLUMA_WEBUI_HOST: 0.0.0.0
      SNOWLUMA_WEBUI_PORT: 5099
      SNOWLUMA_HOOK_AUTOLOAD: "1"
      SNOWLUMA_QQ_FLAGS: "--disable-gpu --disable-software-rasterizer --disable-gpu-compositing"
      # Empty -> a random remote-desktop password is generated and printed once
      # in the logs on first start (kept on the data volume).
      VNC_PASSWD: ${VNC_PASSWD:-}
    ports:
      # noVNC login desktop (6081) + SnowLuma WebUI (5099) bind to PANEL_BIND_IP
      # (netbird wt0 on the host) so mesh peers reach them directly; never
      # public. Falls back to loopback when unset. OneBot 3000/3001 are NOT
      # published: SnowLuma connects OUT to astrbot's reverse-WS server.
      - "${PANEL_BIND_IP:-127.0.0.1}:6081:6081"
      - "${PANEL_BIND_IP:-127.0.0.1}:5099:5099"
    volumes:
      - qq-gateway-data:/app/data
      - qq-client-config:/app/.config
      - qq-client-data:/app/.local/share
    # internal carries the reverse WS to astrbot; edge is QQ's outbound to Tencent.
    networks: [internal, edge]
    depends_on:
      astrbot:
        condition: service_healthy
      snowluma-init:
        condition: service_completed_successfully

  t2i:
    image: soulter/astrbot-t2i-service:latest@sha256:f7243fd37cc247f13da2b23eb394e77cae18ee7b104440ee776d55419e89f61e
    platform: linux/amd64
    container_name: alicedev-t2i
    restart: unless-stopped
    expose: ["8999"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8999), 3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 45s

  paseo:
    image: alicedev/paseo:local
    platform: linux/amd64
    container_name: alicedev-paseo
    restart: unless-stopped
    build:
      context: ${ALICEDEV_APP_DIR:-../app}
      dockerfile: deploy/paseo/Dockerfile
      args:
        PASEO_BASE_IMAGE: alicedev/paseo-base:local
        OMP_VERSION: ${OMP_VERSION:-18.2.5}
        DOCKER_GID: ${DOCKER_GID:-989}
    environment:
      PASEO_PASSWORD: ${PASEO_PASSWORD:?set PASEO_PASSWORD}
      ALICEDEV_INTERNAL_API: http://astrbot:6200
      ALICEDEV_INTERNAL_TOKEN: ${ALICEDEV_INTERNAL_TOKEN:?set ALICEDEV_INTERNAL_TOKEN}
      # paseo validates Host on both internal bot calls and public gateway calls.
      PASEO_HOSTNAMES: paseo,${ALICEDEV_HOST:?set ALICEDEV_HOST},localhost
      PASEO_LISTEN: 0.0.0.0:6767
      PASEO_WEB_UI_ENABLED: "true"
      # omp inside paseo reads this key for the opencode-go provider.
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:?}
      # Agents: git/gh (issue → PR, fixed-main fetch, deploy fetch). The image's
      # git credential helper reads GITHUB_TOKEN at call time.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN}
      GH_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN}
      # deployrun (deploying state): AstrBot plugin hot reload, scope `plugin`.
      ASTRBOT_API_KEY: ${ASTRBOT_API_KEY:?set ASTRBOT_API_KEY}
      # e2e_driver: WebChat login on the resident e2e stack.
      E2E_DASHBOARD_PASSWORD: ${E2E_DASHBOARD_PASSWORD:?set E2E_DASHBOARD_PASSWORD}
    expose: ["6767"]
    volumes:
      - paseo_home:/home/paseo
      - workspace:/workspace
      - reports:/srv/alicedev/reports
      # Host checkouts: the production bot/templates (deployrun) and the e2e stack source.
      - ${ALICEDEV_APP_DIR:-../app}:/deploy/app
      - ${E2E_SRC_DIR:-../e2e-src}:/deploy/e2e-src
      # Agents reach e2e / tg-cli / astrbot (restart) through docker exec.
      - /var/run/docker.sock:/var/run/docker.sock
    # edge = egress for the model provider API and git; e2e = the resident e2e stack's WebChat.
    networks: [internal, edge, e2e]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:6767/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 45s

networks:
  edge:
    name: alicedev-edge
  internal:
    name: alicedev
    internal: true
  # Owned here, joined by the separate e2e project (deploy/e2e) as external.
  # Internal: the e2e stack has no egress and publishes no ports; only paseo
  # agents (e2e_driver + agent-browser) reach its WebChat.
  e2e:
    name: alicedev-e2e
    internal: true

volumes:
  astrbot_data:
    name: alicedev_astrbot_data
  qq-gateway-data:
    name: alicedev_qq_gateway_data
  qq-client-config:
    name: alicedev_qq_client_config
  qq-client-data:
    name: alicedev_qq_client_data
  paseo_home:
    name: alicedev_paseo_home
  workspace:
    name: alicedev_workspace
  reports:
    name: alicedev_reports
  caddy_data:
    name: alicedev_caddy_data
  caddy_config:
    name: alicedev_caddy_config
